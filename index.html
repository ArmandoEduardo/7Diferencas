  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #F5F0D5;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  .tela { position: absolute; inset: 0; display: none; }
  .tela.ativa { display: block; }

  .fundo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    pointer-events: none;
    user-select: none;
  }

  .erro {
    position: absolute;
    border: 3px solid transparent;
    border-radius: 4px;
    cursor: default;   /* sem pointer: usuário descobre clicando */
  }
  .erro.encontrado { border-color: #ff0000; }

  #contador {
    position: absolute; top: 16px; left: 16px;
    font-size: clamp(18px, 2.5vw, 34px);
    font-weight: bold; color: #ff0000;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
    pointer-events: none; z-index: 20;
  }

  #overlay-parabens {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.47);
    display: none; align-items: center; justify-content: center;
    z-index: 30;
  }
  #overlay-parabens.ativo { display: flex; }

  #popup {
    background: #fff;
    border: 4px solid #323232;
    border-radius: 10px;
    width: min(500px, 86vw);
    padding: 34px 24px 28px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  #popup h2 { color: #323232; font-size: clamp(28px, 4vw, 48px); margin-bottom: 22px; }
  #popup p  { color: #323232; font-size: clamp(15px, 1.8vw, 24px); margin-bottom: 30px; }
  #btn-proximo {
    background: #323232; color: #fff; border: none; border-radius: 8px;
    padding: 16px 46px; font-size: clamp(16px, 1.9vw, 26px);
    font-weight: bold; cursor: pointer; letter-spacing: 1px;
  }
  #btn-proximo:hover  { background: #4a4a4a; }
  #btn-proximo:active { transform: scale(.97); }

  #btn-menu { position: absolute; cursor: pointer; border-radius: 8px; }
</style>

// Botão INICIAR no menu (px de 1920x1080 → %)
const BOTAO_MENU_PCT = { left: 41.67, top: 83.33, width: 16.67, height: 7.41 };

/* ============================================================
   ELEMENTOS
   ============================================================ */
const $ = (id) => document.getElementById(id);

const elMenu     = $("tela-menu");
const elJogo     = $("tela-jogo");
const elFinal    = $("tela-final");
const imgMenu    = $("img-menu");
const imgJogo    = $("img-jogo");
const imgFinal   = $("img-final");
const areaJogo   = $("area-jogo");
const contador   = $("contador");
const overlay    = $("overlay-parabens");
const btnProximo = $("btn-proximo");
const btnMenu    = $("btn-menu");

const TELAS_NOMES = [
  "assets/ODS_01.png","assets/ODS_02.png","assets/ODS_03.png",
  "assets/ODS_04.png","assets/ODS_05.png","assets/ODS_06.png",
  "assets/ODS_07.png","assets/ODS_08.png","assets/ODS_09.png",
  "assets/ODS_10.png","assets/ODS_11.png","assets/ODS_12.png",
  "assets/ODS_13.png","assets/ODS_14.png","assets/ODS_15.png",
  "assets/ODS_16.png","assets/ODS_17.png",
];

let odsAtual = 0;
let errosEncontrados = new Set();
let parabensAberto = false;

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function carregarImagem(src, fallbackLabel) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(src);
    img.onerror = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 1920; canvas.height = 1080;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#F5F0D5"; ctx.fillRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#323232"; ctx.font = "bold 60px Arial"; ctx.textAlign = "center";
      ctx.fillText(fallbackLabel, 960, 540);
      resolve(canvas.toDataURL());
    };
    img.src = src;
  });
}

function mostrarTela(qual) {
  elMenu.classList.toggle("ativa",  qual === "menu");
  elJogo.classList.toggle("ativa",  qual === "jogo");
  elFinal.classList.toggle("ativa", qual === "final");
}

/* ============================================================
   LÓGICA DO JOGO
   ============================================================ */
async function carregarODS(indice) {
  const src = await carregarImagem(TELAS_NOMES[indice], "ODS " + (indice + 1));
  imgJogo.src = src;

  errosEncontrados.clear();
  parabensAberto = false;
  overlay.classList.remove("ativo");
  areaJogo.innerHTML = "";

  // ERROS_PCT já está em %, aplica direto
  ERROS_PCT[indice].forEach(([x, y, w, h], i) => {
    const div = document.createElement("div");
    div.className = "erro";
    div.dataset.index = i;
    div.style.left   = x + "%";
    div.style.top    = y + "%";
    div.style.width  = w + "%";
    div.style.height = h + "%";
    div.addEventListener("click", () => clicarErro(i, div));
    areaJogo.appendChild(div);
  });

  atualizarContador();
}

function atualizarContador() {
  const total = ERROS_PCT[odsAtual].length;
  contador.textContent = `Erros: ${errosEncontrados.size}/${total}`;
}

function clicarErro(indice, div) {
  if (parabensAberto || errosEncontrados.has(indice)) return;
  errosEncontrados.add(indice);
  div.classList.add("encontrado");
  atualizarContador();
  if (errosEncontrados.size === ERROS_PCT[odsAtual].length) {
    parabensAberto = true;
    overlay.classList.add("ativo");
  }
}

function posicionarBotaoMenu() {
  btnMenu.style.left   = BOTAO_MENU_PCT.left   + "%";
  btnMenu.style.top    = BOTAO_MENU_PCT.top    + "%";
  btnMenu.style.width  = BOTAO_MENU_PCT.width  + "%";
  btnMenu.style.height = BOTAO_MENU_PCT.height + "%";
}

/* ============================================================
   FLUXO
   ============================================================ */
function iniciarJogo() {
  odsAtual = 0;
  carregarODS(odsAtual);
  mostrarTela("jogo");
}

function proximaODS() {
  odsAtual++;
  if (odsAtual >= TELAS_NOMES.length) { finalizarJogo(); return; }
  carregarODS(odsAtual);
}

async function finalizarJogo() {
  const src = await carregarImagem("assets/parabens.png", "Parabéns!");
  imgFinal.src = src;
  mostrarTela("final");
  setTimeout(() => { mostrarTela("menu"); odsAtual = 0; }, 5000);
}

/* ============================================================
   EVENTOS
   ============================================================ */
btnMenu.addEventListener("click", iniciarJogo);
btnProximo.addEventListener("click", (e) => { e.stopPropagation(); proximaODS(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { mostrarTela("menu"); odsAtual = 0; }
});

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  const srcMenu = await carregarImagem("assets/1.png", "Menu Inicial");
  imgMenu.src = srcMenu;
  posicionarBotaoMenu();
  mostrarTela("menu");
})();
